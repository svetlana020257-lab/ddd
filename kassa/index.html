<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Касса Art Mosaic</title>
<meta name="theme-color" content="#2B2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Касса">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script>
  // Обычный переход — сразу в приложение. Ссылка с ?ikonka — страница для добавления иконки на телефон
  var APP = 'https://script.google.com/macros/s/AKfycbz19KS3-W0EvcN7TiCvM9X8OfRSwnRg3XLOn_BgSkLpnRVidH1QG6mpGF8m-eTLZkCKow/exec';
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  var setup = /ikonka/.test(location.search + location.hash);
  if (standalone || !setup) location.replace(APP);
</script>
<style>
  html,body{margin:0;min-height:100%;background:#2B2440;color:#fff;font:500 16px/1.5 system-ui,-apple-system,sans-serif}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;box-sizing:border-box}
  img{width:110px;height:110px;border-radius:50%;animation:b 1.4s ease-in-out infinite}
  @keyframes b{50%{transform:translateY(-8px) rotate(-4deg)}}
  .card{background:rgba(255,255,255,.08);border-radius:18px;padding:16px 18px;max-width:340px;text-align:left;font-size:15px}
  .card b{color:#F49BB6}
  a.btn{display:inline-block;margin-top:6px;padding:14px 22px;border-radius:14px;background:#E86A92;color:#fff;text-decoration:none;font-weight:700}
  .muted{opacity:.6;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <img src="icon-180.png" alt="Феня">
  <div id="msg">Феня открывает кассу…</div>
</div>
<script>
  if (setup && !standalone) {
    document.getElementById('msg').outerHTML =
      '<h2 style="margin:0">Касса Art Mosaic</h2>' +
      '<div class="card"><b>iPhone:</b> внизу «Поделиться» ⬆️ → «На экран Домой».<br><br>' +
      '<b>Android:</b> ⋮ в Chrome → «Добавить на главный экран».</div>' +
      '<div class="muted">На экране появится Феня с подписью «Касса» — она будет сразу открывать приложение.</div>' +
      '<a class="btn" href="' + APP + '">Открыть кассу</a>';
  } else {
    setTimeout(function () {
      document.getElementById('wrap').insertAdjacentHTML('beforeend', '<a class="btn" href="' + APP + '">Открыть кассу</a>');
    }, 4000);
  }
</script>
</body>
</html>
