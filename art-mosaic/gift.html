<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Вам подарок — Art Mosaic</title>
<meta property="og:title" content="Вам подарок от мастерской Art Mosaic">
<meta property="og:description" content="Откройте конверт — внутри подарочный сертификат.">
<meta property="og:image" content="img/t_f_phoenix_phrase.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@500;800&display=swap">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#FFF2F7;--ink:#2B0F3D;--muted:#8A6F86;--pink:#E23C80;--pink2:#C92A6E;--pink3:#F27AAA;--violet:#7A2E92;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.bgtiles{position:fixed;inset:0;opacity:.6;background:url(img/bg.jpg) center/cover;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse at center,transparent 25%,#000 85%);mask-image:radial-gradient(ellipse at center,transparent 25%,#000 85%)}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-inline:16px;padding-block:32px}
.hello{text-align:center;display:flex;flex-direction:column;gap:8px;transition:opacity .4s}
.hello h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,46px);margin:0;letter-spacing:-.01em;color:var(--ink)}
.hello h1 b{color:var(--pink)}
.hello p{margin:0;color:var(--muted);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase}

/* envelope */
.env{position:relative;width:min(92vw,520px);aspect-ratio:1.55;cursor:pointer;border:0;padding:0;background:none;perspective:1200px;-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:3px solid var(--pink);outline-offset:8px;border-radius:14px}
.env .back{position:absolute;inset:0;border-radius:14px;background:var(--pink2);box-shadow:0 24px 40px -22px rgba(122,46,146,.6)}
.env .card{position:absolute;left:5%;right:5%;top:8%;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12);aspect-ratio:794/454;background:#fff;z-index:1}
.env .card img{display:block;width:100%;height:100%;object-fit:cover}
.env .pocket{position:absolute;inset:0;z-index:2;pointer-events:none}
.env .pocket svg{width:100%;height:100%;display:block}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;transform-origin:50% 0;transform:rotateX(0deg);pointer-events:none}
.env .flap svg{width:100%;height:100%;display:block;overflow:visible}
.seal{position:absolute;left:50%;top:58%;width:64px;height:64px;transform:translate(-50%,-50%);z-index:4;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(122,46,146,.35);display:grid;place-items:center}
.seal i{display:grid;grid-template-columns:repeat(3,11px);gap:2px;transform:rotate(-10deg)}
.seal i b{width:11px;height:11px;border-radius:2px;display:block}
.tap{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet);transition:opacity .3s}
@media (prefers-reduced-motion:no-preference){
  .env.idle{animation:wiggle 2.6s ease-in-out infinite}
  @keyframes wiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-2.2deg)}90%{transform:rotate(2deg)}94%{transform:rotate(-1.2deg)}}
}
.env:not(.open) .card{visibility:hidden}
.env.open .flap{transform:rotateX(180deg);z-index:0;transition:transform .55s cubic-bezier(.3,.7,.3,1),z-index 0s .27s}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6);transition:all .25s}
.env.rise .card{transform:translateY(-78%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.env.gone .back,.env.gone .pocket,.env.gone .flap{opacity:0;transform:translateY(60px);transition:all .5s}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(94vw,760px)}
.result[hidden]{display:none}
.flip{position:relative;width:100%;aspect-ratio:794/454;perspective:1600px;cursor:pointer;border:0;padding:0;background:none}
.flip .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.flip.turned .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 30px 50px -28px rgba(122,46,146,.65),0 2px 0 rgba(122,46,146,.08)}
.flip .face canvas{width:100%;height:100%;display:block}
.flip .face.b{transform:rotateY(180deg)}
.flip:focus-visible{outline:3px solid var(--pink);outline-offset:6px;border-radius:16px}
.hint{color:var(--muted);font-size:13px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font-family:var(--display);font-weight:800;font-size:13px;border:0;border-radius:12px;padding:14px 20px;cursor:pointer;background:var(--pink);color:#fff}
.btn.ghost{background:#fff;color:var(--violet);border:1.5px solid #EFD9E5}
.btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.info{text-align:center;font-size:13.5px;line-height:1.55;color:var(--muted)}
.info b{color:var(--ink)}
.fade-in{animation:fin .6s both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.err{text-align:center;max-width:420px}
.err h1{font-family:var(--display);font-size:22px}
</style></head><body>
<div class="bgtiles" aria-hidden="true"></div>
<canvas id="confetti"></canvas>
<main id="main">
  <div class="hello" id="hello"><p>мастерская Art Mosaic</p><h1>Вам <b>подарок!</b></h1></div>
  <button class="env idle" id="env" aria-label="Открыть конверт">
    <span class="back"></span>
    <span class="card" id="envcard"><img id="envimg" alt=""></span>
    <span class="pocket"><svg viewBox="0 0 155 100" preserveAspectRatio="none"><path d="M0 22 L77.5 62 L155 22 L155 100 L0 100Z" fill="#E23C80"/><path d="M0 100 L62 54 L77.5 62 L93 54 L155 100Z" fill="#EC5A95"/><path d="M0 22 L62 54 L0 100Z" fill="#D9347A"/><path d="M155 22 L93 54 L155 100Z" fill="#D9347A"/></svg></span>
    <span class="flap"><svg viewBox="0 0 155 58" preserveAspectRatio="none"><path d="M0 0 H155 L77.5 58Z" fill="#F27AAA"/><path d="M0 0 H155 L77.5 58Z" fill="none" stroke="#E23C80" stroke-width=".6"/></svg></span>
    <span class="seal" aria-hidden="true"><i><b style="background:#7A2E92"></b><b style="background:#F7841E"></b><b style="background:#7C7CFF"></b><b style="background:#E23C80"></b><b style="background:#FFD92B"></b><b style="background:#7A2E92"></b></i></span>
  </button>
  <div class="tap" id="tap">Нажмите на конверт</div>

  <section class="result" id="result" hidden>
    <button class="flip" id="flip" aria-label="Перевернуть сертификат">
      <span class="inner"><span class="face a"><canvas id="cf" width="2481" height="1419"></canvas></span><span class="face b"><canvas id="cb" width="2481" height="1419"></canvas></span></span>
    </button>
    <div class="hint" id="fliphint">Нажмите на сертификат, чтобы перевернуть</div>
    <div class="btns"><button class="btn" id="pdf">Скачать PDF</button><button class="btn ghost" id="turn">Перевернуть</button></div>
    <div class="info">Запишитесь заранее по телефону <b>+7 913 002-95-52</b><br>Комсомольский пр-т, 24 · 8 этаж · кабинет 815</div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const D=AM.decode(new URLSearchParams(location.search).get('c')||'');
if(!D){
  $('main').innerHTML='<div class="err"><h1>Ссылка не открылась</h1><p>Похоже, ссылка скопировалась не целиком. Попросите мастерскую Art Mosaic прислать её ещё раз: +7 913 002-95-52.</p></div>';
} else start();

async function start(){
  const key='f_'+(AM.DESIGNS.find(d=>d[0]===D.design)?D.design:'phrase');
  $('envimg').src=AM.img(key);
  const [fr,bk]=await Promise.all([AM.load(AM.img(key)),AM.load(AM.img('back')),AM.fontsReady()]).then(r=>r);
  AM.drawFront($('cf'),fr);AM.drawBack($('cb'),bk,D);
  document.fonts.ready.then(()=>AM.drawBack($('cb'),bk,D));
  let opened=false;
  $('env').addEventListener('click',()=>{if(opened)return;opened=true;openEnv();});
  $('flip').addEventListener('click',()=>$('flip').classList.toggle('turned'));
  $('turn').addEventListener('click',()=>$('flip').classList.toggle('turned'));
  $('pdf').addEventListener('click',()=>{
    try{AM.download(`Подарочный сертификат Art Mosaic ${D.num||''}.pdf`.replace(/\s+\.pdf$/,'.pdf'),AM.pdf($('cf'),$('cb')))}catch(e){console.error(e);$('fliphint').textContent='Не получилось сохранить PDF: '+e.message}
  });
}

function wait(ms){return new Promise(r=>setTimeout(r,reduce?0:ms))}
async function openEnv(){
  const env=$('env');env.classList.remove('idle');$('tap').style.opacity=0;
  env.classList.add('open');await wait(380);
  const r=env.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.35);
  env.classList.add('rise');await wait(850);
  // FLIP: от карточки в конверте к большой карточке
  const from=$('envcard').getBoundingClientRect();
  env.classList.add('gone');await wait(250);
  env.style.display='none';$('tap').style.display='none';
  $('result').hidden=false;
  const to=$('flip').getBoundingClientRect();
  if(!reduce){
    $('flip').animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width})`,transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)'});
    burst(to.left+to.width/2,to.top+to.height*.4,90);
  }
  document.querySelectorAll('.result>:not(.flip)').forEach((el,i)=>{el.classList.add('fade-in');el.style.animationDelay=(.5+i*.08)+'s'});
}

// конфетти: мозаичные осколки + кружочки
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
const COLS=['#E23C80','#F27AAA','#7A2E92','#A458BD','#7C7CFF','#FFD92B','#F7841E','#FFFFFF'];
function burst(x,y,n=160){
  if(reduce)return;
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25,v=6+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,s:5+Math.random()*9,
      c:COLS[(Math.random()*COLS.length)|0],t:Math.random()<.45?0:Math.random()<.6?1:2,life:0,w:Math.random()*Math.PI*2});}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<360);
  for(const p of parts){p.life++;p.vy+=.22;p.vx*=.985;p.vy*=.985;p.x+=p.vx+Math.sin(p.w+p.life*.08)*.6;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.abs(Math.cos(p.life*.1+p.w))*.7+.3);cx.fillStyle=p.c;
    if(p.c==='#FFFFFF'){cx.strokeStyle='#F2C3D7';cx.lineWidth=1}
    cx.beginPath();
    if(p.t===0)cx.rect(-p.s/2,-p.s/2,p.s,p.s);
    else if(p.t===1){cx.moveTo(-p.s/2,p.s/2);cx.lineTo(p.s/2,p.s/2);cx.lineTo(0,-p.s/2);cx.closePath()}
    else cx.arc(0,0,p.s*.35,0,Math.PI*2);
    cx.fill();if(p.c==='#FFFFFF')cx.stroke();cx.restore();}
  raf=parts.length?requestAnimationFrame(tick):0;
}
</script>
</body></html>
