<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2440; --ink2:#6B6480; --mute:#9A93A8; --line:#ECE6F2;
    --bg:#F7F3EF; --card:#FFFFFF;
    --inc:#1F9D6B; --incbg:#E6F6EE; --exp:#D9485F; --expbg:#FCE9EC;
    --pink:#E86A92; --gold:#F2B544; --teal:#3BA8B5; --violet:#7B5EA7;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .hidden{display:none!important}

  #app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

  /* шапка */
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 18px;
       background:var(--ink);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(43,36,64,.18)}
  .logo{width:38px;height:38px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px;transform:rotate(-8deg)}
  .logo i{border-radius:4px;display:block}
  .logo i:nth-child(1){background:var(--pink);clip-path:polygon(0 0,100% 0,0 100%)}
  .logo i:nth-child(2){background:var(--gold)}
  .logo i:nth-child(3){background:var(--teal)}
  .logo i:nth-child(4){background:var(--violet);clip-path:polygon(100% 0,100% 100%,0 100%)}
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px}
  .sub{font-size:12px;opacity:.7}
  .top .grow{flex:1}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:20px;display:grid;place-items:center}
  .icon-btn.spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  main{padding:16px}
  .tab{display:none}
  .tab.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line),0 4px 16px rgba(43,36,64,.05);margin-bottom:14px}
  .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:16px 2px 8px}
  .lbl:first-child{margin-top:0}

  /* тип */
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#EFEAF4;border-radius:14px;padding:4px;gap:4px}
  .seg button{padding:12px;border-radius:11px;font-weight:700;color:var(--ink2);transition:.15s}
  .seg button.on.inc{background:var(--inc);color:#fff;box-shadow:0 4px 12px rgba(31,157,107,.3)}
  .seg button.on.exp{background:var(--exp);color:#fff;box-shadow:0 4px 12px rgba(217,72,95,.3)}

  /* сумма */
  .amount{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:18px 0 6px}
  .amount input{width:100%;max-width:300px;border:0;outline:0;background:transparent;text-align:center;
    font-size:44px;font-weight:800;letter-spacing:-1px}
  .amount input::placeholder{color:#D6D0DF}
  .amount span{font-size:28px;font-weight:700;color:var(--mute)}
  body.t-inc .amount input{color:var(--inc)}
  body.t-exp .amount input{color:var(--exp)}

  /* чипсы */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;background:#F3EFF7;color:var(--ink);font-weight:600;font-size:14px;border:1.5px solid transparent;transition:.12s}
  .chip.on{background:var(--ink);color:#fff}
  body.t-inc #cats .chip.on{background:var(--inc)}
  body.t-exp #cats .chip.on{background:var(--exp)}
  .dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dates input{flex:1;min-width:150px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:15px}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;resize:vertical;outline:0;background:#fff;font-size:15px}
  textarea:focus,.dates input:focus{border-color:var(--violet)}

  .primary{width:100%;margin-top:18px;padding:16px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:17px;
    box-shadow:0 8px 20px rgba(43,36,64,.25);transition:.15s}
  body.t-inc .primary{background:var(--inc);box-shadow:0 8px 20px rgba(31,157,107,.3)}
  body.t-exp .primary{background:var(--exp);box-shadow:0 8px 20px rgba(217,72,95,.3)}
  .primary:disabled{opacity:.6}
  .edit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .ghost,.danger{padding:13px;border-radius:14px;font-weight:700}
  .ghost{background:#EFEAF4}
  .danger{background:var(--expbg);color:var(--exp)}
  .edit-badge{display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:8px;background:#FFF4D6;color:#8A6510;font-size:13px;font-weight:700}

  .mini{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2)}
  .mini b{font-weight:800}

  /* месяц */
  .month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .month button{width:44px;height:44px;border-radius:14px;background:#fff;font-size:22px;font-weight:700;box-shadow:0 1px 0 var(--line)}
  .month .title{font-weight:800;font-size:19px}

  .totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .tot{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 var(--line)}
  .tot small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
  .tot b{display:block;font-size:16px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* журнал */
  .day{font-size:13px;font-weight:700;color:var(--mute);margin:16px 4px 6px;display:flex;justify-content:space-between}
  .op{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 0 var(--line);width:100%;text-align:left}
  .op:active{transform:scale(.99)}
  .dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;flex:none}
  .dot.inc{background:var(--incbg);color:var(--inc)}
  .dot.exp{background:var(--expbg);color:var(--exp)}
  .op .mid{flex:1;min-width:0}
  .op .cat{font-weight:700;font-size:15px}
  .op .com{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .op .sum{font-weight:800;white-space:nowrap}
  .op .sum.inc{color:var(--inc)} .op .sum.exp{color:var(--exp)}
  .empty{text-align:center;color:var(--mute);padding:40px 10px}
  .empty div{font-size:38px;margin-bottom:6px}

  /* итоги */
  .big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .kpi{border-radius:var(--r);padding:16px;color:#fff}
  .kpi small{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
  .kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px}
  .kpi.inc{background:linear-gradient(135deg,#1F9D6B,#35B989)}
  .kpi.exp{background:linear-gradient(135deg,#D9485F,#EC6C7F)}
  .profit{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .profit small{opacity:.7;font-weight:600}
  .profit b{font-size:24px;font-weight:800}
  .bars h3{margin:0 0 12px;font-size:15px}
  .bar{margin-bottom:10px}
  .bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
  .bar .t span:first-child{font-weight:600}
  .bar .t span:last-child{font-weight:800;white-space:nowrap}
  .bar .track{height:8px;border-radius:6px;background:#F1ECF5;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  table.year{width:100%;border-collapse:collapse;font-size:14px}
  table.year th{font-size:11px;text-transform:uppercase;color:var(--mute);text-align:right;padding:6px 4px;letter-spacing:.4px}
  table.year th:first-child,table.year td:first-child{text-align:left}
  table.year td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-weight:600;white-space:nowrap}
  table.year tr.cur td{background:#F6F2FA}
  table.year tr{cursor:pointer}
  table.year tfoot td{font-weight:800;border-top:2px solid var(--ink)}
  .inc-t{color:var(--inc)} .exp-t{color:var(--exp)}
  .link-btn{display:block;text-align:center;padding:14px;border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none;box-shadow:0 1px 0 var(--line)}

  /* нижнее меню */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  nav.bottom .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px;gap:6px}
  nav.bottom button{position:relative;padding:8px 2px;border-radius:12px;color:var(--mute);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.bottom button .ic{font-size:22px;line-height:1}
  nav.bottom button.on{color:var(--ink);background:#F3EFF7}

  nav.bottom .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--exp);color:#fff;font-size:10px;line-height:17px;font-weight:800}

  /* платежи и дела */
  .head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .head-row h2{margin:0;font-size:21px;font-weight:800}
  .add-btn{padding:10px 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
  .group{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px;color:var(--mute)}
  .group.red{color:var(--exp)} .group.amber{color:#B07A0C}
  .pay{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 0 var(--line)}
  .pay.overdue{box-shadow:inset 3px 0 0 var(--exp),0 1px 0 var(--line)}
  .pay.soon{box-shadow:inset 3px 0 0 var(--gold),0 1px 0 var(--line)}
  .cal{width:46px;flex:none;text-align:center;border-radius:11px;background:#F3EFF7;padding:5px 0}
  .cal b{display:block;font-size:19px;font-weight:800;line-height:1.1}
  .cal small{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink2)}
  .pay.overdue .cal{background:var(--expbg);color:var(--exp)}
  .pay .mid{flex:1;min-width:0;text-align:left}
  .pay .nm{font-weight:700;font-size:15px}
  .pay .meta{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pay .am{font-weight:800;white-space:nowrap;font-size:15px}
  .done-btn{width:40px;height:40px;flex:none;border-radius:12px;background:var(--incbg);color:var(--inc);font-size:20px;font-weight:800}
  .done-btn.exp{background:var(--expbg);color:var(--exp)}
  .rep{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:#EFEAF5;color:var(--violet);margin-left:4px;vertical-align:2px}
  .banner{display:flex;align-items:center;gap:10px;background:#FFF4D6;color:#7A5608;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600;font-size:14px;width:100%;text-align:left}
  .banner.red{background:var(--expbg);color:var(--exp)}
  .banner b{font-weight:800}

  .task-new{display:flex;gap:8px;margin-bottom:6px}
  .task-new input[type=text]{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;font-size:15px}
  .task-new input[type=text]:focus{border-color:var(--violet)}
  .task-new button{width:50px;border-radius:14px;background:var(--ink);color:#fff;font-size:24px;font-weight:700}
  .task-opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .task-opts .chip{padding:6px 11px;font-size:13px}
  .task-opts input[type=date]{padding:5px 9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
  .task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 0 var(--line)}
  .check{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid #CFC7DA;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;transition:.15s}
  .task.done .check{background:var(--inc);border-color:var(--inc)}
  .task .tx{flex:1;min-width:0;text-align:left;font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
  .task.done .tx{color:var(--mute);text-decoration:line-through;font-weight:500}
  .due{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:#F3EFF7;color:var(--ink2);white-space:nowrap}
  .due.red{background:var(--expbg);color:var(--exp)} .due.amber{background:#FFF4D6;color:#8A6510}
  .toggle-done{width:100%;padding:12px;margin-top:8px;border-radius:12px;color:var(--ink2);font-weight:700;background:#EFEAF4}

  /* календарь */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calhead .title{font-weight:800;font-size:17px}
  .calhead button{width:38px;height:38px;border-radius:12px;background:#F3EFF7;font-size:20px;font-weight:700}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cgrid .wd{font-size:11px;font-weight:800;color:var(--mute);text-align:center;padding:2px 0 4px;text-transform:uppercase}
  .cgrid .wd.we{color:var(--pink)}
  .cday{aspect-ratio:1/1;border-radius:12px;background:#FAF7FC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;position:relative;border:2px solid transparent}
  .cday.out{opacity:.35}
  .cday.today{background:#FFF4D6}
  .cday.sel{border-color:var(--ink);background:#fff}
  .cday .dots{display:flex;gap:3px;height:6px}
  .cday .dots i{width:6px;height:6px;border-radius:50%}
  .d-exp{background:var(--exp)} .d-inc{background:var(--inc)} .d-task{background:var(--violet)} .d-ev{background:var(--teal)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--ink2);font-weight:600}
  .legend span{display:flex;align-items:center;gap:4px} .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px}
  .dayhead b{font-size:16px} .dayhead small{color:var(--ink2);font-weight:600}
  .ditem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 0 var(--line)}
  .ditem .tm{font-weight:800;font-size:13px;color:var(--teal);min-width:44px}
  .ditem .tx{flex:1;min-width:0;font-weight:600;font-size:14px;text-align:left}
  .ditem .tx small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
  .ditem .x{width:32px;height:32px;border-radius:10px;background:#F3EFF7;color:var(--ink2);font-weight:800}
  .dadd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .dadd button{padding:10px 4px;border-radius:12px;background:#fff;font-weight:700;font-size:13px;box-shadow:0 1px 0 var(--line)}
  .calwarn{font-size:12px;color:#8A6510;background:#FFF4D6;border-radius:10px;padding:8px 10px;margin-top:10px}

  /* модальное окно */
  .modal{position:fixed;inset:0;z-index:25;background:rgba(43,36,64,.45);display:flex;align-items:flex-end;justify-content:center}
  .modal .panel{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 4px;font-size:19px;font-weight:800}
  .modal .hint{font-size:13px;color:var(--ink2);margin:6px 2px 0}
  .field{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;font-size:16px;font-weight:600}
  .field:focus{border-color:var(--violet)}
  .field.big{font-size:26px;font-weight:800}
  .modal .seg{margin-top:4px}
  @media (min-width:700px){ .modal{align-items:center} .modal .panel{border-radius:22px} }

  /* тост, оверлеи */
  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;transition:.25s;max-width:90vw;text-align:center;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--exp)}
  .overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px}
  .pinbox{width:100%;max-width:320px;text-align:center}
  .pinbox .logo{margin:0 auto 16px;width:56px;height:56px}
  .pinbox input{width:100%;text-align:center;font-size:30px;letter-spacing:10px;padding:14px;border-radius:16px;border:2px solid var(--line);outline:0;background:#fff;font-weight:800}
  .loading{text-align:center;color:var(--mute);padding:60px 0}
  .loading .logo{margin:0 auto 14px;animation:spin 2.4s linear infinite}

  @media (min-width:700px){
    .amount input{font-size:52px}
  }
</style>
</head>
<body class="t-inc">
<div id="app">
  <header class="top">
    <div class="logo"><i></i><i></i><i></i><i></i></div>
    <div class="grow"><div class="brand">Art Mosaic</div><div class="sub">доходы и расходы мастерской</div></div>
    <button id="refreshBtn" class="icon-btn" title="Обновить из таблицы">↻</button>
  </header>

  <main>
    <div id="boot" class="loading"><div class="logo"><i></i><i></i><i></i><i></i></div>Загружаю данные…</div>

    <!-- ДОБАВИТЬ -->
    <section id="tab-add" class="tab">
      <button id="payBanner" class="banner hidden"></button>
      <div class="card">
        <div id="editBadge" class="edit-badge hidden">✎ Редактирование записи</div>
        <div class="seg" id="typeSeg">
          <button data-type="Доход" class="inc on">＋ Доход</button>
          <button data-type="Расход" class="exp">− Расход</button>
        </div>
        <div class="amount">
          <input id="amount" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done">
          <span>₽</span>
        </div>
      </div>

      <div class="card">
        <label class="lbl">Дата</label>
        <div class="dates">
          <button class="chip" data-shift="0">Сегодня</button>
          <button class="chip" data-shift="-1">Вчера</button>
          <input type="date" id="date">
        </div>

        <label class="lbl">Категория</label>
        <div id="cats" class="chips"></div>

        <label class="lbl">Способ оплаты</label>
        <div id="methods" class="chips"></div>

        <label class="lbl">Комментарий</label>
        <textarea id="comment" rows="2" placeholder="Например: МК «Ваза», 3 человека"></textarea>

        <button id="saveBtn" class="primary">Сохранить</button>
        <div id="editRow" class="edit-row hidden">
          <button id="cancelEdit" class="ghost">Отмена</button>
          <button id="delBtn" class="danger">Удалить</button>
        </div>
      </div>

      <div class="card mini" id="todayLine"></div>
    </section>

    <!-- ЖУРНАЛ -->
    <section id="tab-log" class="tab">
      <div class="month">
        <button data-step="-1">‹</button><div class="title js-month"></div><button data-step="1">›</button>
      </div>
      <div class="totals" id="logTotals"></div>
      <div id="logList"></div>
    </section>

        <table class="year" id="yearTable"></table>

  </div></nav>
</div>

<div id="pinScreen" class="overlay hidden">
  <div class="pinbox">
    <div class="logo"><i></i><i></i><i></i><i></i></div>
    <h2 style="margin:0 0 6px">Art Mosaic</h2>
    <p style="color:var(--ink2);margin:0 0 18px">Введите ПИН-код</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <button id="pinBtn" class="primary">Войти</button>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="panel" id="modalPanel"></div></div>
<div id="toast"></div>

<script>
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const PALETTE = ['#E86A92','#3BA8B5','#F2B544','#7B5EA7','#1F9D6B','#E98A4F','#5C7FD6','#C45BAA','#8AB04A','#D9485F'];

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('am_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('am_'+k, JSON.stringify(v)); }catch(e){} }
};

const S = {
  ops: [], pays: [], tasks: [], cats: {income:[], expense:[], methods:[]}, url: '#',
  taskDue: '', taskRep: 'Разово', showDone: false,
  calMonth: todayStr().slice(0,7), calDay: todayStr(), events: {}, calOk: true,
  type: 'Доход', cat: '', method: store.get('method',''), date: todayStr(),
  editId: null, month: todayStr().slice(0,7), pin: store.get('pin',''), busy: false
};

/* ---------- утилиты ---------- */
function todayStr(shift){
  const d = new Date(); d.setDate(d.getDate() + (shift||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function money(n, sign){
  const s = Math.abs(n).toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' ₽';
  if (!sign) return (n<0?'−':'') + s;
  return (n<0?'− ':'+ ') + s;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthTitle(ym){ const [y,m] = ym.split('-'); return MONTHS[+m-1] + ' ' + y; }
function shiftMonth(ym, k){ let [y,m] = ym.split('-').map(Number); m += k; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+'-'+String(m).padStart(2,'0'); }
function dayTitle(ds){
  const d = new Date(ds+'T12:00:00');
  const t = todayStr(), y = todayStr(-1);
  const base = d.getDate()+' '+MONTHS_GEN[d.getMonth()]+', '+WD[d.getDay()];
  return ds===t ? 'Сегодня · '+base : ds===y ? 'Вчера · '+base : base;
}
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err?' err':'');
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className = err?'err':'', 2600);
}
function call(fn, ...args){
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
function errText(e){ return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/,''); }

/* ---------- загрузка ---------- */
async function load(quiet){
  const btn = $('#refreshBtn'); btn.classList.add('spin');
  try{
    const r = await call('apiInit', S.pin);
    applyData(r);
    saveCache();
    if (quiet === 'manual') toast('Данные обновлены');
  }catch(e){
    const m = errText(e);
    if (m.includes('PIN_REQUIRED')) { showPin(); }
    else { S.loadError = m; renderCats(); toast('Нет связи с таблицей: ' + m, true); }
  }finally{
    btn.classList.remove('spin');
    $('#boot').classList.add('hidden');
    if (!$$('.tab.active').length) switchTab('add');
  }
}
function saveCache(){ store.set('cache', {ops:S.ops, pays:S.pays, tasks:S.tasks, cats:S.cats, url:S.url}); }
function applyData(r){
  S.loadError = '';
  S.ops = r.ops || S.ops; S.pays = r.pays || S.pays; S.tasks = r.tasks || S.tasks;
  S.cats = r.cats || S.cats; S.url = r.url || S.url;
  $('#sheetLink').href = S.url;
  renderAll();
}

/* ---------- ПИН ---------- */
function showPin(){ $('#pinScreen').classList.remove('hidden'); setTimeout(()=>$('#pinInput').focus(), 100); }
$('#pinBtn').onclick = async () => {
  S.pin = $('#pinInput').value.trim();
  try{
    const r = await call('apiInit', S.pin);
    store.set('pin', S.pin);
    $('#pinScreen').classList.add('hidden');
    applyData(r);
  }catch(e){ toast(errText(e).includes('PIN_REQUIRED') ? 'Неверный ПИН' : errText(e), true); }
};
$('#pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#pinBtn').click(); });

/* ---------- вкладки ---------- */
function switchTab(name){
  $$('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-'+name));
  $$('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  window.scrollTo({top:0});
  if (name === 'log') renderLog();
  if (name === 'sum') renderSum();
  if (name === 'pay') { renderPays(); renderCal(); loadEvents(S.calMonth); }
  if (name === 'task') renderTasks();
}
$$('nav.bottom button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$$('.month button').forEach(b => b.onclick = () => { S.month = shiftMonth(S.month, +b.dataset.step); renderLog(); renderSum(); });
$('#refreshBtn').onclick = () => load('manual');

/* ---------- форма ---------- */
function setType(t){
  S.type = t;
  document.body.className = t === 'Доход' ? 't-inc' : 't-exp';
  $$('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.type === t));
  const list = t === 'Доход' ? S.cats.income : S.cats.expense;
  if (!list.includes(S.cat)) S.cat = '';
  renderCats();
}
$$('#typeSeg button').forEach(b => b.onclick = () => setType(b.dataset.type));

function setDate(ds){
  S.date = ds; $('#date').value = ds;
  $$('.dates .chip').forEach(c => c.classList.toggle('on', todayStr(+c.dataset.shift) === ds));
}
$$('.dates .chip').forEach(c => c.onclick = () => setDate(todayStr(+c.dataset.shift)));
$('#date').onchange = e => setDate(e.target.value || todayStr());

function renderCats(){
  const list = (S.type === 'Доход' ? S.cats.income : S.cats.expense).slice();
  if (S.cat && !list.includes(S.cat)) list.push(S.cat);
  $('#cats').innerHTML = list.map(c => `<button class="chip${c===S.cat?' on':''}" data-v="${esc(c)}">${esc(c)}</button>`).join('')
    || (S.loadError
      ? `<span style="color:var(--exp);font-size:14px">⚠️ Не загрузилось из таблицы: ${esc(S.loadError)}<br>Нажмите ↻ или пришлите этот текст Светлане</span>`
      : '<span style="color:var(--mute);font-size:14px">Загружаю категории… если долго — нажмите ↻</span>');
  $$('#cats .chip').forEach(b => b.onclick = () => { S.cat = S.cat === b.dataset.v ? '' : b.dataset.v; renderCats(); });
}
function renderMethods(){
  const list = S.cats.methods.slice();
  if (S.method && !list.includes(S.method)) list.push(S.method);
  $('#methods').innerHTML = list.map(c => `<button class="chip${c===S.method?' on':''}" data-v="${esc(c)}">${esc(c)}</button>`).join('');
  $$('#methods .chip').forEach(b => b.onclick = () => {
    S.method = S.method === b.dataset.v ? '' : b.dataset.v;
    if (!S.editId) store.set('method', S.method);
    renderMethods();
  });
}

function resetForm(){
  S.editId = null; S.cat = '';
  $('#amount').value = ''; $('#comment').value = '';
  $('#editBadge').classList.add('hidden'); $('#editRow').classList.add('hidden');
  $('#saveBtn').textContent = 'Сохранить';
  S.method = store.get('method','');
  setDate(todayStr()); renderCats(); renderMethods();
}

function editOp(id){
  const op = S.ops.find(o => o.id === id); if (!op) return;
  S.editId = id; S.cat = op.cat; S.method = op.method;
  setType(op.type); setDate(op.date);
  $('#amount').value = String(op.amount).replace('.', ',');
  $('#comment').value = op.comment;
  renderCats(); renderMethods();
  $('#editBadge').classList.remove('hidden'); $('#editRow').classList.remove('hidden');
  $('#saveBtn').textContent = 'Сохранить изменения';
  switchTab('add');
}
$('#cancelEdit').onclick = () => { resetForm(); switchTab('log'); };

$('#amount').addEventListener('input', e => {
  let v = e.target.value.replace(/[^\d.,\s]/g,'').replace('.', ',');
  const parts = v.split(','); if (parts.length > 2) v = parts[0] + ',' + parts.slice(1).join('');
  e.target.value = v;
});

$('#saveBtn').onclick = async () => {
  if (S.busy) return;
  const amount = parseFloat($('#amount').value.replace(/\s/g,'').replace(',', '.'));
  if (!(amount > 0)) { toast('Введите сумму', true); $('#amount').focus(); return; }
  if (!S.cat) { toast('Выберите категорию', true); return; }
  const op = { id: S.editId, type: S.type, amount, cat: S.cat, method: S.method, comment: $('#comment').value, date: S.date };
  const btn = $('#saveBtn'), label = btn.textContent;
  S.busy = true; btn.disabled = true; btn.textContent = 'Сохраняю…';
  try{
    const r = await call('apiSave', S.pin, op);
    const wasEdit = !!S.editId;
    applyData(r); saveCache();
    toast((wasEdit ? 'Изменено: ' : 'Записано: ') + money(op.type==='Доход'?amount:-amount, true) + ' · ' + op.cat);
    resetForm();
    if (wasEdit) switchTab('log');
  }catch(e){
    btn.textContent = label;
    toast('Не сохранилось: ' + errText(e), true);
  }finally{
    S.busy = false; btn.disabled = false;
    if (btn.textContent === 'Сохраняю…') btn.textContent = S.editId ? 'Сохранить изменения' : 'Сохранить';
  }
};

$('#delBtn').onclick = async () => {
  if (!S.editId || S.busy) return;
  if (!confirm('Удалить эту запись из таблицы?')) return;
  S.busy = true;
  try{
    const r = await call('apiDelete', S.pin, S.editId);
    applyData(r); saveCache();
    toast('Запись удалена'); resetForm(); switchTab('log');
  }catch(e){ toast('Не удалилось: ' + errText(e), true); }
  finally{ S.busy = false; }
};

/* ---------- подсчёты ---------- */
function opsOfMonth(ym){ return S.ops.filter(o => o.date.slice(0,7) === ym); }
function totals(list){
  const inc = list.filter(o=>o.type==='Доход').reduce((s,o)=>s+o.amount,0);
  const exp = list.filter(o=>o.type==='Расход').reduce((s,o)=>s+o.amount,0);
  return {inc, exp, profit: inc-exp};
}

function renderToday(){
  const t = totals(S.ops.filter(o => o.date === todayStr()));
  const m = totals(opsOfMonth(todayStr().slice(0,7)));
  $('#todayLine').innerHTML =
    `<div>Сегодня<br><b class="inc-t">${money(t.inc,true)}</b> · <b class="exp-t">${money(-t.exp,true)}</b></div>
     <div style="text-align:right">${MONTHS[new Date().getMonth()]}: прибыль<br><b class="${m.profit<0?'exp-t':'inc-t'}">${money(m.profit)}</b></div>`;
}

function renderLog(){
  $$('.js-month').forEach(el => el.textContent = monthTitle(S.month));
  const list = opsOfMonth(S.month).sort((a,b) => b.date.localeCompare(a.date) || b.added - a.added);
  const t = totals(list);
  $('#logTotals').innerHTML =
    `<div class="tot"><small>Доходы</small><b class="inc-t">${money(t.inc)}</b></div>
     <div class="tot"><small>Расходы</small><b class="exp-t">${money(t.exp)}</b></div>
     <div class="tot"><small>Прибыль</small><b class="${t.profit<0?'exp-t':''}">${money(t.profit)}</b></div>`;
  if (!list.length){
    $('#logList').innerHTML = '<div class="empty"><div>🧩</div>В этом месяце пока нет записей</div>';
    return;
  }
  let html = '', cur = '';
  list.forEach(o => {
    if (o.date !== cur){
      cur = o.date;
      const d = totals(list.filter(x => x.date === cur));
      html += `<div class="day"><span>${dayTitle(cur)}</span><span>${money(d.profit, true)}</span></div>`;
    }
    const inc = o.type === 'Доход';
    const sub = [o.method, o.comment].filter(Boolean).join(' · ');
    html += `<button class="op" data-id="${esc(o.id)}">
      <div class="dot ${inc?'inc':'exp'}">${inc?'＋':'−'}</div>
      <div class="mid"><div class="cat">${esc(o.cat)}</div>${sub?`<div class="com">${esc(sub)}</div>`:''}</div>
      <div class="sum ${inc?'inc':'exp'}">${money(inc?o.amount:-o.amount, true)}</div>
    </button>`;
  });
  $('#logList').innerHTML = html;
  $$('#logList .op').forEach(b => b.onclick = () => editOp(b.dataset.id));
}

function bars(title, list, color){
  const by = {};
  list.forEach(o => by[o.cat] = (by[o.cat]||0) + o.amount);
  const rows = Object.entries(by).sort((a,b) => b[1]-a[1]);
  if (!rows.length) return `<h3>${title}</h3><div style="color:var(--mute);font-size:14px">Нет записей</div>`;
  const max = rows[0][1], total = rows.reduce((s,r)=>s+r[1],0);
  return `<h3>${title}</h3>` + rows.map(([c,v],i) => `
    <div class="bar"><div class="t"><span>${esc(c)}</span><span>${money(v)} <span style="color:var(--mute);font-weight:600">· ${Math.round(v/total*100)}%</span></span></div>
    <div class="track"><div class="fill" style="width:${Math.max(3, v/max*100)}%;background:${color==='inc'?PALETTE[(i+4)%PALETTE.length]:PALETTE[i%PALETTE.length]}"></div></div></div>`).join('');
}

function renderSum(){
  $$('.js-month').forEach(el => el.textContent = monthTitle(S.month));
  const list = opsOfMonth(S.month), t = totals(list);
  $('#kInc').textContent = money(t.inc);
  $('#kExp').textContent = money(t.exp);
  $('#kProfit').textContent = money(t.profit);
  $('#kProfit').style.color = t.profit < 0 ? '#FF9AA9' : '#8EF0C4';
  $('#incBars').innerHTML = bars('Доходы по категориям', list.filter(o=>o.type==='Доход'), 'inc');
  $('#expBars').innerHTML = bars('Расходы по категориям', list.filter(o=>o.type==='Расход'), 'exp');

  const y = S.month.slice(0,4);
  $('#yearTitle').textContent = 'По месяцам · ' + y;
  let rows = '', sum = {inc:0,exp:0,profit:0};
  for (let m = 1; m <= 12; m++){
    const ym = y + '-' + String(m).padStart(2,'0');
    const tt = totals(opsOfMonth(ym));
    if (!tt.inc && !tt.exp && ym !== S.month) continue;
    sum.inc += tt.inc; sum.exp += tt.exp; sum.profit += tt.profit;
    rows += `<tr data-ym="${ym}" class="${ym===S.month?'cur':''}"><td>${MONTHS[m-1]}</td>
      <td class="inc-t">${money(tt.inc)}</td><td class="exp-t">${money(tt.exp)}</td>
      <td class="${tt.profit<0?'exp-t':''}">${money(tt.profit)}</td></tr>`;
  }
  $('#yearTable').innerHTML = `<thead><tr><th>Месяц</th><th>Доход</th><th>Расход</th><th>Прибыль</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Итого</td><td class="inc-t">${money(sum.inc)}</td><td class="exp-t">${money(sum.exp)}</td><td>${money(sum.profit)}</td></tr></tfoot>`;
  $$('#yearTable tbody tr').forEach(r => r.onclick = () => { S.month = r.dataset.ym; renderSum(); renderLog(); });
}

/* ---------- общие помощники ---------- */
const MON_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function daysFromToday(ds){
  const a = new Date(ds+'T12:00:00'), b = new Date(todayStr()+'T12:00:00');
  return Math.round((a - b) / 86400000);
}
function dueLabel(ds){
  const n = daysFromToday(ds), d = new Date(ds+'T12:00:00');
  if (n === 0) return 'сегодня';
  if (n === 1) return 'завтра';
  if (n === -1) return 'вчера';
  return d.getDate()+' '+MON_SHORT[d.getMonth()];
}
function chipsHtml(list, val, name){
  return list.map(c => `<button class="chip${c===val?' on':''}" data-${name}="${esc(c)}">${esc(c)}</button>`).join('');
}
function bindChips(root, name, onPick){
  root.querySelectorAll('[data-'+name+']').forEach(b => b.onclick = () => {
    root.querySelectorAll('[data-'+name+']').forEach(x => x.classList.toggle('on', x === b && !b.classList.contains('on')));
    onPick(b.classList.contains('on') ? b.dataset[name] : '');
  });
}
function openModal(html){ $('#modalPanel').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalPanel').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
async function run(fn, args, okMsg, btn){
  if (S.busy) return false;
  S.busy = true; let label;
  if (btn){ label = btn.textContent; btn.disabled = true; btn.textContent = 'Сохраняю…'; }
  try{
    const r = await call(fn, S.pin, ...args);
    applyData(r); saveCache();
    if (okMsg) toast(okMsg);
    return true;
  }catch(e){
    toast(errText(e), true);
    return false;
  }finally{
    S.busy = false;
    if (btn){ btn.disabled = false; btn.textContent = label; }
  }
}

/* ---------- календарь платежей ---------- */
const REPEATS = ['Разово','Ежемесячно','Еженедельно','Ежеквартально','Ежегодно'];
const REP_SHORT = {'Ежемесячно':'каждый месяц','Еженедельно':'каждую неделю','Ежеквартально':'раз в квартал','Ежегодно':'раз в год'};

function pendingPays(){ return S.pays.filter(p => p.status !== 'Оплачено').sort((a,b) => a.date.localeCompare(b.date)); }

function renderPays(){
  const list = pendingPays();
  const ym = todayStr().slice(0,7);
  const month = list.filter(p => p.date.slice(0,7) <= ym);
  const out = month.filter(p => p.type==='Расход').reduce((s,p)=>s+p.amount,0);
  const inn = month.filter(p => p.type==='Доход').reduce((s,p)=>s+p.amount,0);
  const overdue = list.filter(p => daysFromToday(p.date) < 0);
  $('#payTotals').innerHTML =
    `<div class="tot"><small>Оплатить до конца месяца</small><b class="exp-t">${money(out)}</b></div>
     <div class="tot"><small>Ожидаем поступлений</small><b class="inc-t">${money(inn)}</b></div>
     <div class="tot"><small>Просрочено</small><b class="${overdue.length?'exp-t':''}">${overdue.length}</b></div>`;
  if (!list.length){
    $('#payList').innerHTML = '<div class="empty"><div>📅</div>Платежей пока нет.<br>Добавьте аренду, налоги, закупки —<br>приложение напомнит о сроках.</div>';
    return;
  }
  const groups = [
    ['Просрочено', 'red', p => daysFromToday(p.date) < 0],
    ['Сегодня и ближайшие 7 дней', 'amber', p => { const n = daysFromToday(p.date); return n >= 0 && n <= 7; }],
    ['Позже в этом месяце', '', p => daysFromToday(p.date) > 7 && p.date.slice(0,7) === ym],
    ['Следующие месяцы', '', p => daysFromToday(p.date) > 7 && p.date.slice(0,7) > ym]
  ];
  let html = '';
  groups.forEach(([title, cls, f]) => {
    const g = list.filter(f); if (!g.length) return;
    html += `<div class="group ${cls}">${title}</div>`;
    g.forEach(p => {
      const n = daysFromToday(p.date), d = new Date(p.date+'T12:00:00');
      const inc = p.type === 'Доход';
      const meta = [n<0 ? 'просрочен на '+(-n)+' дн.' : dueLabel(p.date), p.cat, p.method].filter(Boolean).join(' · ');
      html += `<div class="pay ${n<0?'overdue':n<=3?'soon':''}">
        <div class="cal"><b>${d.getDate()}</b><small>${MON_SHORT[d.getMonth()]}</small></div>
        <button class="mid" data-edit="${esc(p.id)}">
          <div class="nm">${esc(p.name)}${p.repeat!=='Разово'?`<span class="rep">↻ ${REP_SHORT[p.repeat]}</span>`:''}</div>
          <div class="meta">${esc(meta)}</div>
        </button>
        <div class="am ${inc?'inc-t':'exp-t'}">${p.amount ? money(p.amount) : '—'}</div>
        <button class="done-btn ${inc?'':'exp'}" data-done="${esc(p.id)}" title="${inc?'Получено':'Оплачено'}">✓</button>
      </div>`;
    });
  });
  $('#payList').innerHTML = html;
  $$('#payList [data-edit]').forEach(b => b.onclick = () => payForm(S.pays.find(p => p.id === b.dataset.edit)));
  $$('#payList [data-done]').forEach(b => b.onclick = () => payDoneForm(S.pays.find(p => p.id === b.dataset.done)));
}
$('#payAdd').onclick = () => payForm(null);

function payForm(p, presetDate){
  const f = Object.assign({id:'', name:'', type:'Расход', cat:'', amount:'', date:presetDate || todayStr(), repeat:'Ежемесячно', method:'', comment:''}, p || {});
  const catsOf = t => t === 'Доход' ? S.cats.income : S.cats.expense;
  openModal(`
    <h3>${p ? 'Платёж' : 'Новый платёж'}</h3>
    <label class="lbl" style="margin-top:12px">Название</label>
    <input class="field" id="pName" value="${esc(f.name)}" placeholder="Например: Аренда студии">
    <div class="seg" id="pType" style="margin-top:12px">
      <button data-type="Расход" class="exp">− Нужно оплатить</button>
      <button data-type="Доход" class="inc">＋ Ожидаем деньги</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label class="lbl">Сумма, ₽</label><input class="field" id="pAmount" inputmode="decimal" value="${f.amount?String(f.amount).replace('.',','):''}" placeholder="0"></div>
      <div><label class="lbl">Дата</label><input class="field" id="pDate" type="date" value="${f.date}"></div>
    </div>
    <label class="lbl">Повтор</label><div class="chips" id="pRep">${chipsHtml(REPEATS, f.repeat, 'rep')}</div>
    <label class="lbl">Категория</label><div class="chips" id="pCat"></div>
    <label class="lbl">Способ оплаты</label><div class="chips" id="pMeth">${chipsHtml(S.cats.methods, f.method, 'meth')}</div>
    <label class="lbl">Комментарий</label><input class="field" id="pCom" value="${esc(f.comment)}" placeholder="Необязательно">
    <button class="primary" id="pSave" style="background:var(--ink)">Сохранить</button>
    <div class="edit-row">
      <button class="ghost" id="pCancel">Отмена</button>
      ${p ? '<button class="danger" id="pDel">Удалить</button>' : '<span></span>'}
    </div>`);
  const drawType = () => {
    $$('#pType button').forEach(b => b.classList.toggle('on', b.dataset.type === f.type));
    if (f.cat && !catsOf(f.type).includes(f.cat) && !(p && p.cat === f.cat)) f.cat = '';
    const list = catsOf(f.type).slice(); if (f.cat && !list.includes(f.cat)) list.push(f.cat);
    $('#pCat').innerHTML = chipsHtml(list, f.cat, 'cat');
    bindChips($('#pCat'), 'cat', v => f.cat = v);
  };
  $$('#pType button').forEach(b => b.onclick = () => { f.type = b.dataset.type; drawType(); });
  drawType();
  bindChips($('#pRep'), 'rep', v => { f.repeat = v || 'Разово'; if (!v) $('#pRep [data-rep="Разово"]').classList.add('on'); });
  bindChips($('#pMeth'), 'meth', v => f.method = v);
  $('#pCancel').onclick = closeModal;
  $('#pSave').onclick = async () => {
    const data = Object.assign({}, f, {
      name: $('#pName').value, amount: $('#pAmount').value, date: $('#pDate').value, comment: $('#pCom').value
    });
    if (await run('apiPaySave', [data], p ? 'Платёж обновлён' : 'Платёж добавлен', $('#pSave'))) closeModal();
  };
  if (p) $('#pDel').onclick = async () => {
    if (!confirm('Удалить платёж «'+p.name+'»' + (p.repeat!=='Разово' ? ' и все его повторы' : '') + '?')) return;
    if (await run('apiPayDelete', [p.id], 'Платёж удалён')) closeModal();
  };
}

function payDoneForm(p){
  const inc = p.type === 'Доход';
  let method = p.method;
  const next = p.repeat !== 'Разово' ? nextDateJs(p.date, p.repeat) : '';
  openModal(`
    <h3>${inc ? 'Деньги получены' : 'Платёж оплачен'}</h3>
    <div class="hint">${esc(p.name)} — запишется в журнал как ${inc ? 'доход' : 'расход'}${p.cat ? ' «'+esc(p.cat)+'»' : ''}</div>
    <label class="lbl" style="margin-top:14px">Сумма, ₽</label>
    <input class="field big ${inc?'inc-t':'exp-t'}" id="dAmount" inputmode="decimal" value="${p.amount?String(p.amount).replace('.',','):''}" placeholder="0">
    <label class="lbl">Дата оплаты</label>
    <input class="field" id="dDate" type="date" value="${todayStr()}">
    <label class="lbl">Способ оплаты</label><div class="chips" id="dMeth">${chipsHtml(S.cats.methods, method, 'meth')}</div>
    ${next ? `<div class="hint" style="margin-top:12px">↻ Следующий срок: <b>${dueLabel(next)} ${next.slice(0,4)}</b></div>` : ''}
    <button class="primary" id="dSave" style="background:${inc?'var(--inc)':'var(--exp)'}">${inc ? 'Получено' : 'Оплачено'} — записать</button>
    <div class="edit-row" style="grid-template-columns:1fr"><button class="ghost" id="dCancel">Отмена</button></div>`);
  bindChips($('#dMeth'), 'meth', v => method = v);
  $('#dCancel').onclick = closeModal;
  $('#dSave').onclick = async () => {
    const amount = parseFloat($('#dAmount').value.replace(/\s/g,'').replace(',', '.'));
    if (!(amount > 0)) { toast('Введите сумму', true); return; }
    const ok = await run('apiPayDone', [p.id, {amount, date: $('#dDate').value || todayStr(), method}],
      (inc ? 'Получено: ' : 'Оплачено: ') + money(amount) + ' · записано в журнал', $('#dSave'));
    if (ok) closeModal();
  };
}

function nextDateJs(ds, repeat){
  const [y,m,d] = ds.split('-').map(Number);
  let t;
  if (repeat === 'Ежедневно') t = new Date(Date.UTC(y, m-1, d+1));
  else if (repeat === 'Еженедельно') t = new Date(Date.UTC(y, m-1, d+7));
  else {
    const add = repeat === 'Ежеквартально' ? 3 : repeat === 'Ежегодно' ? 12 : 1;
    const last = new Date(Date.UTC(y, m-1+add+1, 0)).getUTCDate();
    t = new Date(Date.UTC(y, m-1+add, Math.min(d, last)));
  }
  return t.toISOString().slice(0,10);
}

  $$('#taskOpts .chip').forEach(c => c.classList.toggle('on',
    (c.dataset.due === '' && !v) || (c.dataset.due !== '' && v && todayStr(+c.dataset.due) === v)));

}
$$('#taskOpts .chip').forEach(c => c.onclick = () => setTaskDue(c.dataset.due === '' ? '' : todayStr(+c.dataset.due)));

const TASK_REP = [['Разово','нет'],['Ежедневно','каждый день'],['Еженедельно','неделя'],['Ежемесячно','месяц'],['Ежеквартально','квартал'],['Ежегодно','год']];

function bindRep(id, onPick){

async function addTask(){
  const text = $('#taskText').value.trim();
  if (!text) { $('#taskText').focus(); return; }
  const ok = await run('apiTaskSave', [{text, due: S.taskDue, repeat: S.taskRep}],
    S.taskRep !== 'Разово' ? 'Регулярное дело добавлено ↻' : 'Задача добавлена');
  if (ok){ $('#taskText').value = ''; setTaskDue(''); setTaskRep('Разово'); }
}
$('#taskAdd').onclick = addTask;
$('#taskText').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

function taskHtml(t){
  let due = '';
  if (t.due && !t.done){
    const n = daysFromToday(t.due);
    due = `<span class="due ${n<0?'red':n===0?'amber':''}">${dueLabel(t.due)}</span>`;
  }
  return `<div class="task ${t.done?'done':''}">
    <button class="check" data-check="${esc(t.id)}">${t.done?'✓':''}</button>
    <button class="tx" data-tedit="${esc(t.id)}">${esc(t.text)}${t.repeat && t.repeat!=='Разово' && !t.done ? `<span class="rep">↻ ${TASK_REP_LONG[t.repeat]}</span>` : ''}</button>${due}</div>`;
}

function renderTasks(){
  const open = S.tasks.filter(t => !t.done).sort((a,b) =>
    (a.due||'9999') .localeCompare(b.due||'9999') || a.created - b.created);
  const done = S.tasks.filter(t => t.done).sort((a,b) => b.doneAt - a.doneAt);
  let html = '';
  if (!open.length) html += '<div class="empty"><div>✨</div>Все дела сделаны</div>';
  const over = open.filter(t => t.due && daysFromToday(t.due) < 0);
  const today = open.filter(t => t.due && daysFromToday(t.due) === 0);
  const later = open.filter(t => t.due && daysFromToday(t.due) > 0);
  const nodate = open.filter(t => !t.due);
  [['Просрочено','red',over],['Сегодня','amber',today],['Скоро','',later],['Без срока','',nodate]].forEach(([title,cls,g]) => {
    if (!g.length) return;
    html += `<div class="group ${cls}">${title}</div>` + g.map(taskHtml).join('');
  });
  if (done.length){
    html += `<button class="toggle-done" id="toggleDone">${S.showDone ? 'Скрыть выполненные' : 'Выполненные ('+done.length+')'}</button>`;
    if (S.showDone) html += '<div style="margin-top:8px">' + done.slice(0,40).map(taskHtml).join('') + '</div>';
  }
  $('#taskList').innerHTML = html;
  $$('#taskList [data-check]').forEach(b => b.onclick = () => toggleTask(b.dataset.check));
  $$('#taskList [data-tedit]').forEach(b => b.onclick = () => taskForm(S.tasks.find(t => t.id === b.dataset.tedit)));
  const td = $('#toggleDone'); if (td) td.onclick = () => { S.showDone = !S.showDone; renderTasks(); };
}

async function toggleTask(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const was = t.done;
  t.done = !was; t.doneAt = Date.now();          // сразу показываем, потом сохраняем
  renderTasks(); renderBadges();
  try{
    const r = await call('apiTaskToggle', S.pin, id, t.done);
    applyData(r); saveCache();
    if (t.done && t.repeat && t.repeat !== 'Разово' && t.due){
      let next = nextDateJs(t.due, t.repeat); while (next <= todayStr()) next = nextDateJs(next, t.repeat);
      toast('✓ Сделано · ↻ следующее — ' + dueLabel(next));
    }
  }catch(e){
    t.done = was; renderTasks(); renderBadges();
    toast('Не сохранилось: ' + errText(e), true);
  }
}

function taskForm(t){

/* ---------- календарь ---------- */
const WD_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const EV_KINDS = [['🚚','Поставка'],['🤝','Встреча'],['🎨','МК'],['🎉','Праздник'],['📞','Созвон'],['📌','Другое']];

async function loadEvents(ym, force){
  if (S.events[ym] && !force) return;
  try{
    const r = await call('apiEvents', S.pin, ym);
    S.events[ym] = r.events || []; S.calOk = r.ok !== false;
    renderCal();
  }catch(e){ S.calOk = false; renderCal(); }
}

function dayItems(ds){
  return {
    pays: S.pays.filter(p => p.date === ds && p.status !== 'Оплачено'),
    tasks: S.tasks.filter(t => t.due === ds),
    events: (S.events[ds.slice(0,7)] || []).filter(e => e.day === ds).sort((a,b) => (a.start||'').localeCompare(b.start||'')),
    ops: S.ops.filter(o => o.date === ds)
  };
}

function renderCal(){
  if (!$('#calGrid')) return;
  const [y, m] = S.calMonth.split('-').map(Number);
  $('#calTitle').textContent = MONTHS[m-1] + ' ' + y;
  const first = new Date(y, m-1, 1), shift = (first.getDay() + 6) % 7;
  const start = new Date(y, m-1, 1 - shift);
  let html = WD_SHORT.map((w,i) => `<div class="wd${i>4?' we':''}">${w}</div>`).join('');
  const today = todayStr();
  for (let i = 0; i < 42; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if (i >= 35 && d.getMonth() !== m-1) break;
    const it = dayItems(ds);
    const dots = [];
    if (it.pays.some(p => p.type==='Расход')) dots.push('d-exp');
    if (it.pays.some(p => p.type==='Доход')) dots.push('d-inc');
    if (it.tasks.some(t => !t.done)) dots.push('d-task');
    if (it.events.length) dots.push('d-ev');
    html += `<button class="cday${d.getMonth()!==m-1?' out':''}${ds===today?' today':''}${ds===S.calDay?' sel':''}" data-ds="${ds}">
      ${d.getDate()}<span class="dots">${dots.map(c=>`<i class="${c}"></i>`).join('')}</span></button>`;
  }
  $('#calGrid').innerHTML = html;
  $$('#calGrid .cday').forEach(b => b.onclick = () => {
    S.calDay = b.dataset.ds;
    if (S.calDay.slice(0,7) !== S.calMonth){ S.calMonth = S.calDay.slice(0,7); loadEvents(S.calMonth); }
    renderCal();
  });
  $('#calWarn').innerHTML = S.calOk ? '' : '<div class="calwarn">Google Календарь ещё не подключён — платежи и дела видны, а события появятся после запуска setupCalendar в Apps Script.</div>';
  renderDay();
}

function renderDay(){
  const ds = S.calDay, it = dayItems(ds);
  $('#dayTitle').textContent = dayTitle(ds);
  const t = totals(it.ops);
  $('#dayCash').innerHTML = [t.inc ? `<span class="inc-t">+${money(t.inc)}</span>` : '', t.exp ? `<span class="exp-t">−${money(t.exp)}</span>` : ''].filter(Boolean).join(' · ');
  let html = '';
  it.events.forEach(e => {
    html += `<div class="ditem"><span class="tm">${e.start || 'весь день'}</span>
      <div class="tx">${esc(e.title)}${e.end ? `<small>до ${e.end}</small>` : ''}</div>
      <button class="x" data-evdel="${esc(e.id)}" title="Убрать">✕</button></div>`;
  });
  it.pays.forEach(p => {
    const inc = p.type === 'Доход';
    html += `<div class="ditem"><span class="tm" style="color:${inc?'var(--inc)':'var(--exp)'}">${inc?'💰':'💳'}</span>
      <button class="tx" data-pedit="${esc(p.id)}">${esc(p.name)}<small>${p.amount?money(p.amount):'сумма не указана'}${p.repeat!=='Разово'?' · ↻ '+REP_SHORT[p.repeat]:''}</small></button>
      <button class="done-btn ${inc?'':'exp'}" data-pdone="${esc(p.id)}" style="width:36px;height:36px">✓</button></div>`;
  });
  it.tasks.forEach(tk => {
    html += `<div class="ditem task ${tk.done?'done':''}" style="padding:10px 12px"><button class="check" data-check="${esc(tk.id)}">${tk.done?'✓':''}</button>
      <button class="tx" data-tedit="${esc(tk.id)}">${esc(tk.text)}</button></div>`;
  });
  if (!html) html = '<div style="text-align:center;color:var(--mute);font-size:14px;padding:14px 0">На этот день ничего нет 🐣</div>';
  $('#dayList').innerHTML = html;
  $$('#dayList [data-evdel]').forEach(b => b.onclick = async () => {
    if (!confirm('Убрать событие из календаря?')) return;
    try{ const r = await call('apiEventDelete', S.pin, b.dataset.evdel, S.calDay.slice(0,7)); S.events[S.calDay.slice(0,7)] = r.events; renderCal(); toast('Убрала из календаря'); }
    catch(e){ toast(errText(e), true); }
  });
  $$('#dayList [data-pedit]').forEach(b => b.onclick = () => payForm(S.pays.find(p => p.id === b.dataset.pedit)));
  $$('#dayList [data-pdone]').forEach(b => b.onclick = () => payDoneForm(S.pays.find(p => p.id === b.dataset.pdone)));
  $$('#dayList [data-check]').forEach(b => b.onclick = async () => { await toggleTask(b.dataset.check); renderCal(); });
  $$('#dayList [data-tedit]').forEach(b => b.onclick = () => taskForm(S.tasks.find(t => t.id === b.dataset.tedit)));
}

$('#calPrev').onclick = () => { S.calMonth = shiftMonth(S.calMonth, -1); S.calDay = S.calMonth + '-01'; renderCal(); loadEvents(S.calMonth); };
$('#calNext').onclick = () => { S.calMonth = shiftMonth(S.calMonth, 1); S.calDay = S.calMonth + '-01'; renderCal(); loadEvents(S.calMonth); };

$('#dAddTask').onclick = () => openTaskNew(S.calDay);
$('#dAddEv').onclick = () => eventForm(S.calDay);

function openTaskNew(ds){
  openModal(`<h3>Новое дело</h3>
    <label class="lbl" style="margin-top:12px">Что сделать</label>
    <textarea class="field" id="ntText" rows="2" placeholder="Например: заказать клей"></textarea>
    <label class="lbl">Срок</label><input class="field" id="ntDue" type="date" value="${ds}">
    <label class="lbl">Повтор</label>${repChips('ntRep', 'Разово')}
    <button class="primary" id="ntSave" style="background:var(--ink)">Добавить</button>
    <div class="edit-row" style="grid-template-columns:1fr"><button class="ghost" id="ntCancel">Отмена</button></div>`);
  let rep = 'Разово';
  bindRep('ntRep', v => rep = v);
  $('#ntCancel').onclick = closeModal;
  $('#ntSave').onclick = async () => {
    if (await run('apiTaskSave', [{text: $('#ntText').value, due: $('#ntDue').value, repeat: rep}], 'Дело добавлено', $('#ntSave'))) { closeModal(); renderCal(); }
  };
  setTimeout(() => $('#ntText').focus(), 100);
}

function eventForm(ds){
  let kind = EV_KINDS[0], minutes = 60;
  const durs = [[30,'30 мин'],[60,'1 ч'],[120,'2 ч'],[180,'3 ч']];
  openModal(`<h3>Событие в календарь</h3>
    <label class="lbl" style="margin-top:12px">Что</label>
    <div class="chips" id="eKind">${EV_KINDS.map((k,i) => `<button class="chip${i===0?' on':''}" data-k="${i}">${k[0]} ${k[1]}</button>`).join('')}</div>
    <input class="field" id="eTitle" style="margin-top:10px" placeholder="Например: стекло от «Витраж-Сиб»">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label class="lbl">Дата</label><input class="field" id="eDate" type="date" value="${ds}"></div>
      <div><label class="lbl">Время</label><input class="field" id="eTime" type="time" placeholder="весь день"></div>
    </div>
    <label class="lbl">Длительность</label>
    <div class="chips" id="eDur">${durs.map(d => `<button class="chip${d[0]===60?' on':''}" data-m="${d[0]}">${d[1]}</button>`).join('')}</div>
    <div class="hint">Без времени — событие на весь день. Напоминание придёт за час и накануне.</div>
    <label class="lbl">Заметка</label><input class="field" id="eDesc" placeholder="Необязательно">
    <button class="primary" id="eSave" style="background:var(--teal)">Добавить в календарь</button>
    <div class="edit-row" style="grid-template-columns:1fr"><button class="ghost" id="eCancel">Отмена</button></div>`);
  $$('#eKind .chip').forEach(b => b.onclick = () => { kind = EV_KINDS[+b.dataset.k]; $$('#eKind .chip').forEach(x => x.classList.toggle('on', x === b)); });
  $$('#eDur .chip').forEach(b => b.onclick = () => { minutes = +b.dataset.m; $$('#eDur .chip').forEach(x => x.classList.toggle('on', x === b)); });
  $('#eCancel').onclick = closeModal;
  $('#eSave').onclick = async () => {
    const extra = $('#eTitle').value.trim();
    const label = kind[1] === 'Другое' ? '' : kind[1];
    const title = (kind[0] + ' ' + [label, extra].filter(Boolean).join(' ')).trim();
    if (!extra && kind[1] === 'Другое') { toast('Напишите, что за событие', true); return; }
    const date = $('#eDate').value || ds;
    const btn = $('#eSave'); btn.disabled = true; btn.textContent = 'Сохраняю…';
    try{
      const r = await call('apiEventAdd', S.pin, {title, date, start: $('#eTime').value, minutes, desc: $('#eDesc').value});
      S.events[date.slice(0,7)] = r.events; S.calDay = date; S.calMonth = date.slice(0,7);
      closeModal(); renderCal(); toast('🗓 Добавила в календарь');
    }catch(e){ toast(errText(e), true); btn.disabled = false; btn.textContent = 'Добавить в календарь'; }
  };
}

/* ---------- значки и напоминания ---------- */
function renderBadges(){
  const urgentPays = pendingPays().filter(p => daysFromToday(p.date) <= 3);
  const nowPays = urgentPays.filter(p => daysFromToday(p.date) <= 0);
  const urgentTasks = S.tasks.filter(t => !t.done && t.due && daysFromToday(t.due) <= 0);
  const pb = $('#payBadge'), tb = $('#taskBadge');
  pb.textContent = urgentPays.length; pb.classList.toggle('hidden', !urgentPays.length);
  tb.textContent = urgentTasks.length; tb.classList.toggle('hidden', !urgentTasks.length);

  const ban = $('#payBanner');
  if (urgentPays.length){
    const over = nowPays.some(p => daysFromToday(p.date) < 0);
    const names = urgentPays.slice(0,3).map(p => p.name + ' — ' + dueLabel(p.date)).join(', ');
    ban.className = 'banner' + (over ? ' red' : '');
    ban.innerHTML = `<span style="font-size:20px">${over?'⚠️':'📅'}</span><span><b>${over?'Платежи требуют внимания':'Скоро платежи'}:</b> ${esc(names)}${urgentPays.length>3?' и ещё '+(urgentPays.length-3):''}</span>`;
    ban.onclick = () => switchTab('pay');
  } else ban.className = 'banner hidden';
}

function renderAll(){
  setType(S.type); renderMethods(); renderToday();
  renderLog(); renderSum(); renderPays(); renderTasks(); renderBadges(); renderCal();
}


/* ---------- старт ---------- */
setDate(todayStr());
const cache = store.get('cache', null);
if (cache){ applyData(cache); $('#boot').classList.add('hidden'); switchTab('add'); }
load();
</script>
